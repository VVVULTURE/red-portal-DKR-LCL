<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading…</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ffdddd; font-family: sans-serif; font-size: .9rem; text-align: center; padding: 1rem;
  }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="msg">Loading…</div>
<iframe id="target-frame" title="Proxied content" style="display:none;"></iframe>

<script src="/redproxy/controller-init.js"></script>
<script>
'use strict';
/**
 * Bridge page used as an <iframe> target when a game/site refuses to be
 * embedded directly (X-Frame-Options/CSP) -- see templates.js in the
 * automation bot. This document lives INSIDE that iframe; it initializes
 * the Red Proxy controller and attaches it to a second, INNER iframe
 * (#target-frame) that fills this whole document -- the bot's own iframe
 * sees only the proxied content, visually indistinguishable from a
 * single-level embed.
 *
 * NOT a top-level location.replace() of this document (the previous
 * approach, before this project moved to the Scramjet Controller
 * architecture): confirmed directly that doing so tears the Controller
 * down mid-flight, since it needs to stay resident in the page that
 * created it for its managed frame to keep working -- navigating away
 * left an empty shell document with none of the real proxied content.
 * An iframe kept alive in THIS document works correctly instead, exactly
 * like the in-page Red Proxy section on the main site.
 */
(async () => {
  const msg = document.getElementById('msg');
  const frameEl = document.getElementById('target-frame');
  const params = new URLSearchParams(location.search);
  const target = params.get('url');
  if (!target) {
    msg.textContent = 'No ?url= given.';
    return;
  }

  try {
    const controller = await initRedProxyController();
    const frame = controller.createFrame(frameEl);
    frame.go(target);
    frameEl.style.display = 'block';
    msg.style.display = 'none';
  } catch (err) {
    console.error('[redproxy/embed]', err);
    msg.textContent = 'Could not load this through the proxy: ' + err.message;
  }
})();
</script>
</body>
</html>
